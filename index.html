<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Opening App...</title>
    <script>
      const path = window.location.pathname; // e.g. "/campaigns/123" or "/wallet"
      const segments = path.split("/").filter(Boolean); // ["campaigns", "123"] or ["wallet"]

      const isValidCampaignId = id => id && /^[a-zA-Z0-9_-]+$/.test(id.trim());

      let deepLink = "myworkpartner://home"; // default fallback

      if (segments[0] === "campaigns" && isValidCampaignId(segments[1])) {
        deepLink = `myworkpartner://campaigns/${segments[1].trim()}`;
      } else {
        switch (segments[0]) {
          case "home":
            deepLink = "myworkpartner://home";
            break;
          case "wallet":
            deepLink = "myworkpartner://wallet";
            break;
          case "campaigns":
            deepLink = "myworkpartner://campaigns";
            break;
          case "profile":
            deepLink = "myworkpartner://profile";
            break;
          case "my-profile":
            deepLink = "myworkpartner://my-profile";
            break;
          case "kyc":
            deepLink = "myworkpartner://kyc";
            break;
          case "sell":
            deepLink = "myworkpartner://sell";
            break;
          case "leads":
            deepLink = "myworkpartner://leads";
            break;
          // unrecognized path falls through, stays "home"
        }
      }

      window.location.href = deepLink;

      setTimeout(() => {
        window.location.href =
          "https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME";
      }, 1000);
    </script>
  </head>
  <body>
    <p>Opening MyWorkPartner app…</p>
  </body>
</html>
